name: CI/CD Pipeline - Test & Build Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================================================
  # 1. Backend Verification
  # ============================================================================
  backend-checks:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: Run Test Suite (Vitest)
        run: npm run test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ecomm_test
          JWT_SECRET: testing-jwt-secret-minimum-32-chars-long-key

      - name: Production TypeScript Build
        run: npm run build

  # ============================================================================
  # 2. Frontend Verification
  # ============================================================================
  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: Run Frontend Test Suite
        run: npm run test -- --run

      - name: Production Vite Build & Code Splitting Verification
        run: npm run build

  # ============================================================================
  # 3. AI Service Verification
  # ============================================================================
  ai-service-checks:
    name: AI Service Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: './ai-service/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest
